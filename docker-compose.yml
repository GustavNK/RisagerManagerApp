services:
  # ==========================================================================
  # Frontend - Next.js Application
  # ==========================================================================
  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: risager-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
    networks:
      - risager-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ==========================================================================
  # Backend - .NET 8 API
  # ==========================================================================
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: risager-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5062}:5062"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://+:5062
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-risager};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - ConnectionStrings__AzureBlobStorage=endpoint=minio:9000;accessKey=${MINIO_ROOT_USER:-minioadmin};secretKey=${MINIO_ROOT_PASSWORD:-minioadmin};bucket=${MINIO_BUCKET_NAME:-risager};useSSL=false
      # Admin user seeding configuration
      - AdminUser__Email=${ADMIN_EMAIL:-admin@risager.dk}
      - AdminUser__Password=${ADMIN_PASSWORD:-admin}
      - AdminUser__FirstName=${ADMIN_FIRST_NAME:-Administrator}
      - AdminUser__LastName=${ADMIN_LAST_NAME:-User}
    networks:
      - risager-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5062/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==========================================================================
  # PostgreSQL Database
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: risager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-risager}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - risager-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # MinIO Object Storage
  # ==========================================================================
  minio:
    image: minio/minio
    container_name: risager-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    networks:
      - risager-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ==========================================================================
  # MinIO Bucket Initialization (runs once)
  # ==========================================================================
  minio-init:
    image: minio/mc
    container_name: risager-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set risager http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing risager/$${MINIO_BUCKET_NAME:-risager};
      mc anonymous set public risager/$${MINIO_BUCKET_NAME:-risager};
      exit 0;
      "
    networks:
      - risager-network

volumes:
  postgres-data:
    driver: local
  minio-data:
    driver: local

networks:
  risager-network:
    driver: bridge
